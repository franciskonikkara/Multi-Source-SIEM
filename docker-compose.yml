version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - siem-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.2
    container_name: logstash
    volumes:
      # Use the new relative path to your config file
      - ./elk/logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      # Keep your log folder mounts
      - ./edr-simulation/logs:/usr/share/logstash/edr-simulation/logs
      - ./cloud-simulation/logs:/usr/share/logstash/cloud-simulation/logs
    networks:
      - siem-network
    environment:
      - xpack.monitoring.enabled=false
    depends_on:
      - elasticsearch

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    ports:
      - "5601:5601"
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml
    networks:
      - siem-network
    depends_on:
      - elasticsearch

networks:
  siem-network:
    driver: bridge